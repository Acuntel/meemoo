; Meemoo bench firmware — Seeed XIAO ESP32S3 Sense (docs/BUY_AND_BUILD.md Box A).
;
; Two targets:
;   bench  — Stage 3: spins motor 1 at 20/30/50% PWM, prints duty + est RPM.
;   flight — Stage 6: WiFi station, MJPEG on :81, MUP/1 UDP motor commands,
;            VL53L1X + MPU6050 telemetry, link-loss failsafe (motors zero).
;
; Compile check (no hardware needed):  pio run
; Flash:  make flash-bench / make flash-flight  (from the repo root)

[platformio]
default_envs = bench

[env]
platform = espressif32@^6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:bench]
build_src_filter = +<bench/>

[env:flight]
build_src_filter = +<flight/>
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
lib_deps =
    pololu/VL53L1X@^1.3.1
