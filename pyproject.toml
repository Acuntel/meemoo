[project]
name = "meemoo"
version = "0.1.0"
description = "Meemoo — round helium floating companion robot. Dumb aircraft, smart ground."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    "websockets>=12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]
# Live-video extras: NOT needed for tests (fixtures are landmark JSONL).
# `uv sync --group perception` for the webcam demo / real installs.
perception = [
    "opencv-python>=4.10",
    "mediapipe>=0.10.14",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meemoo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E722 (bare except) is in "E" — bare excepts are banned by Constitution Art. IX.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
# fixture/fetch scripts are CLI tools — print is their UI
"tests/fixtures/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["meemoo", "tests"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "cv2.*", "mediapipe.*", "ultralytics.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
