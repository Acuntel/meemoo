# Alembic config — migrations for the Meemoo SQLite store.
# NOTE: the stock `alembic` CLI needs migrations/env.py, which Brady's
# .env file-protection hook blocks from being created. Until that file is
# whitelisted/added, run migrations with `make migrate` (programmatic runner
# in meemoo/core/migrate.py — same revision files, same alembic_version
# table). This ini is kept so the CLI works the moment env.py exists.

[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///data/meemoo.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
